description: >-
  FOUNDATION + HUB for active trading & how US-retail financial markets work; routes to 16 spokes. Educational ONLY, NOT financial/investment/tax advice; trading can lose money (2026). TRIGGER: how markets work; asset classes (stocks, bonds, forex, commodities, crypto, ETFs, derivatives); participants (market makers, broker-dealers, exchanges, clearinghouses); order routing (PFOF, NBBO, T+1) & order types; sessions & circuit breakers; investing-vs-trading; trading styles; margin/short-selling/PDT; checking a trading broker; DEX/AMM/DeFi/on-chain trading; impermanent loss; MEV/sandwich attacks; ML/AI for trading; feature engineering; alt-data signals; RL for execution. SKIP: long-term passive/retirement investing (401k/IRA/Roth, index buy-and-hold, Social Security, fiduciary) → investing-and-retirement; budgeting → budgeting-and-saving; bank/CD/FDIC → personal-banking; income-tax → personal-income-taxes; investment-fraud recovery → identity-theft-and-credit-fraud; MEV protocol economics → blockchain-economics; ML methods depth → da-analytical-methods.
whenToUse:
  - "how do financial markets actually work for a regular retail person"
  - "what are the asset classes — stocks, bonds, forex, commodities, crypto, ETFs, derivatives"
  - "what's the difference between investing and trading"
  - "who are the market participants — market makers, brokers, exchanges, clearinghouses"
  - "what's the difference between the primary and secondary market"
  - "how does my order get from the broker app to the exchange (routing, PFOF, NBBO)"
  - "what are market vs limit vs stop orders"
  - "when is the market open / what are pre-market and after-hours and circuit breakers"
  - "what is buying on margin / short selling / the pattern day trader rule"
  - "what does SIPC cover and how do I check out a trading broker"
  - "I want to learn to trade — where do I start and which sub-topic do I need"
  - "how do DEXs work / what is Uniswap or an AMM"
  - "what is impermanent loss for liquidity providers"
  - "how do I protect against MEV sandwich attacks on DeFi swaps"
  - "what is a perp DEX — GMX, dYdX, or Hyperliquid"
  - "how does machine learning apply to trading / what ML models are used for stock prediction"
  - "what is feature engineering on market data / how do you build trading signals with ML"
  - "how does reinforcement learning work for trade execution"
  - "how do I read a candlestick chart / what does RSI mean"
  - "what is support and resistance / how do I use moving averages"
  - "how do chart patterns work — head and shoulders, MACD, Bollinger Bands"
whenNotToUse: "Long-term PASSIVE / retirement investing (401(k)/403(b), IRA/Roth/backdoor, employer match & vesting, index buy-and-hold, dollar-cost averaging for retirement, Social Security claiming, target-date-fund or expense-ratio fund selection for a retirement account, picking a robo or fee-only fiduciary, using BrokerCheck to vet a long-term advisor) → investing-and-retirement. Budgeting / emergency fund → budgeting-and-saving. Bank deposit accounts / CDs / FDIC-NCUA → personal-banking. Income-tax forms, brackets, filing → personal-income-taxes. Recovering after an investment scam → identity-theft-and-credit-fraud. MEV supply-chain/PBS theory, AMM math derivation, tokenomics, cryptoeconomics → blockchain-economics. ML/statistical methods at technique depth → da-analytical-methods. Blockchain protocol mechanics → blockchain."
