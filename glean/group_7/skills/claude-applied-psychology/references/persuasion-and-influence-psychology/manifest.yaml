name: persuasion-and-influence-psychology
title: Persuasion & Influence Psychology
version: 1.0.0
category: applied-human-psychology
parentConcept: Applied Human Psychology
description: >-
  The academic theory of attitude change — the mechanism layer beneath
  persuasion tactics. Dual-process models (Elaboration Likelihood Model,
  Heuristic-Systematic Model), cognitive dissonance and self-perception theory,
  psychological reactance, attribution theory, social influence theory
  (normative vs informational, descriptive vs injunctive norms, Asch, Milgram),
  the Yale attitude-change approach, and inoculation theory — applied to
  stakeholder buy-in, change management, and message framing, with WHY each
  works psychologically.
