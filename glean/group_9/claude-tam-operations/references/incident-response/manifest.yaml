id: incident-response
name: Incident Response
description: >
  Incident response lifecycle -- severity classification (SEV0-SEV3, P0-P4),
  incident roles (IC, comms lead, scribe, SME, deputy), communication templates,
  blameless postmortem writing, SLO/SLI/SLA management and error budgets,
  on-call best practices, runbook design, incident metrics (MTTD/MTTR/MTTA/MTBF),
  tool comparison (PagerDuty/Grafana Cloud IRM/incident.io/Squadcast),
  chaos engineering for preparedness, and anti-patterns.
version: 1.1.1
