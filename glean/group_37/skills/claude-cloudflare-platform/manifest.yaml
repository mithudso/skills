name: cloudflare-platform
description: >-
  Cloudflare platform from the network/infrastructure angle — orange-cloud reverse proxy
  effects on DNS answers, source IPs, TLS; authoritative DNS + 1.1.1.1; Tunnel (cloudflared);
  WARP; Access/ZTNA; Magic Transit/WAN; load balancing & Argo; Workers/R2 as infrastructure;
  caching & Cache Rules; 52x, cf-ray/trace debugging.
  TRIGGER: site behind Cloudflare misbehaving (520-526, cf-cache-status, cf-ray,
  /cdn-cgi/trace); origin sees only Cloudflare IPs (CF-Connecting-IP); SSL modes (Flexible vs
  Full strict), 525/526; proxied vs DNS-only, CNAME flattening, MX grey-cloud; 1.1.1.1/DoH
  no-ECS geo effects; cloudflared Tunnel + Access; WARP split tunnels & posture; Magic Transit
  BGP/GRE/MTU; LB steering & health checks; Argo; R2 zero-egress CDN origin; purge, tiered cache.
  SKIP: Workers JS runtime, compat flags, wrangler → lang-js-ts; DNS/BGP protocol internals →
  networking; host-level net tooling → devops-linux-admin; ZTNA concepts/NIST 800-207,
  Okta/IdP internals → security-review / okta-expert.
version: 1.1.1
updated: 2026-06-12
category: developer
whenToUse:
  - site behind Cloudflare throwing 520-526 errors but the origin looks healthy
  - origin logs show only Cloudflare IPs — restore the real client IP
  - pick an SSL encryption mode / fix a redirect loop after enabling Flexible
  - Cloudflare won't cache my HTML / cf-cache-status says DYNAMIC
  - expose an internal app with cloudflared Tunnel plus an Access policy
  - WARP clients can't reach the corporate private network
  - Magic Transit onboarding broke big transfers (GRE MTU/MSS clamping)
  - is Argo worth it / serve a static site from R2 with zero egress
whenNotToUse:
  - Workers JS runtime APIs, compat flags, wrangler config → lang-js-ts
  - DNS protocol internals (DNSSEC, resolution path, DoH mechanics) → networking
  - host-level network diagnostic recipes (ip/ss/dig/tcpdump) → devops-linux-admin
  - Okta/IdP product internals or ZTNA architecture review → security-review / okta-expert
